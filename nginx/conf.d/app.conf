server {
    listen 80;
    server_name gynsys.net www.gynsys.net api.gynsys.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gynsys.net www.gynsys.net;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/gynsys.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gynsys.net/privkey.pem;

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.gynsys.net;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/gynsys.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gynsys.net/privkey.pem;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
