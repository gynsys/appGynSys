server {
    listen 80;
    server_name api.gynsys.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.gynsys.net;
    server_tokens off;

    # Allow large file uploads for Blog covers and Ultrasound Assets
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/api.gynsys.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gynsys.net/privkey.pem;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $upstream_backend backend;
        proxy_pass http://$upstream_backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
