[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://api.gynsys.net/api/v1"
  VITE_GOOGLE_CLIENT_ID = "836443681186-o642l26c5f47oml9atblo8m73cc0i0hv.apps.googleusercontent.com"
  PNPM_FLAGS = "--no-frozen-lockfile"

# Edge Functions directory (relativo a la raíz del proyecto frontend)
[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "doctor-seo-prerender"
  path = "/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=0, must-revalidate"

