<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
  <title></title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    /* Critical CSS for Background color matching the OS theme */
    :root {
      background-color: #030712;
    }

    @media (prefers-color-scheme: dark) {

      :root,
      html,
      body {
        background-color: #030712 !important;
      }
    }

    /* Prevent white flash before theme script */
    html {
      background-color: #030712;
    }

    /* Critical CSS for Dark Mode to prevent FOUC */
    html.dark {
      background-color: #030712;
    }

    html.dark body {
      background-color: #030712;
      color: #f3f4f6;
    }

    html.dark #root {
      background-color: #030712;
    }
  </style>
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('theme_preference');
        const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        const color = isDark ? '#030712' : '#ffffff';

        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          // Only use white if specifically in light mode
          document.documentElement.style.backgroundColor = '#ffffff';
        }

        // Update all theme-color meta tags
        document.querySelectorAll('meta[name="theme-color"]').forEach(el => {
          el.setAttribute('content', color);
        });
      } catch (e) { }
    })();
  </script>
  <!-- Capacitor bridge for remote URL support -->
  <script>
    (function() {
      // 1. Safety Proxy: If we are in an iframe or special context, link the Bridge
      try {
        if (!window.Capacitor && window.parent && window.parent.Capacitor) {
          window.Capacitor = window.parent.Capacitor;
        }
      } catch (e) {}

      // 2. Immediate Debug Ping
      try {
        const pingData = {
          notification_id: 0,
          event: 'debug',
          metadata: { 
            message: 'INDEX_HTML_MOUNTED', 
            ua: navigator.userAgent,
            timestamp: new Date().toISOString()
          }
        };
        fetch('https://api.gynsys.net/api/v1/notifications/track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pingData)
        }).catch(function() {});
      } catch (e) {}

      console.log('[GynSysDebug] Bridge Bridge Proxy Ready');
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
