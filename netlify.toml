[build]
  base = "frontend"
  command = "pnpm run build && cd ../arko360 && npm install && npm run build && cd ../frontend && mkdir -p dist/arko360 && cp -r ../arko360/dist/* dist/arko360/"
  publish = "dist"

[[redirects]]
  from = "/arko360/*"
  to = "/arko360/index.html"
  status = 200

[[redirects]]
  from = "/arko360"
  to = "/arko360/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
