[build]
  base = "frontend"
  command = "cd ../arko360 && pnpm install && pnpm run build && cd ../frontend && pnpm install && pnpm run build && mkdir -p dist/arko360 && cp -r ../arko360/dist/* dist/arko360/"
  publish = "dist"

[[redirects]]
  from = "/arko360/*"
  to = "/arko360/index.html"
  status = 200

[[redirects]]
  from = "/arko360"
  to = "/arko360/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
